<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LSPD</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Cairo;background:#080b10;color:#fff} .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px} .card{background:#11161e;border:1px solid #1e2a3a;border-radius:18px;padding:20px} input{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #1e2a3a;background:#0e1520;color:#fff} .btn{width:100%;padding:12px;border:0;border-radius:12px;background:#2777ff;color:#fff;font-weight:800;cursor:pointer}</style>
</head>
<body>
<div id="auth" class="overlay"><div class="card" style="width:360px;text-align:center"><h2>🚔 LSPD</h2><p style="color:#7c8da6">اذا اسمك جديد بيتسجل تلقائي</p><input id="authName" placeholder="اسمك العسكري"><input id="authPass" type="password" placeholder="كلمة السر"><button class="btn" onclick="authLogin()">🚪 دخول / تسجيل جديد</button><div id="authMsg" style="color:#ffc431;margin-top:10px"></div></div></div>
<div style="padding:40px;text-align:center"><h1>✅ تم الدخول - <span id="who"></span></h1><p>موقعك شغال والفايربيس مربوط</p><button onclick="localStorage.clear();location.reload()" style="padding:10px 20px">تسجيل خروج</button><div style="margin-top:20px"><a href="https://syfalnzy280-creator.github.io/LSPD/" style="color:#2777ff">تحديث الصفحة</a></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDPW113hl8oe6RfF6rpq_-vUQ_0AK34sSs",authDomain:"lspd-2026-1.firebaseapp.com",projectId:"lspd-2026-1"});
const db=getFirestore(app);
let user=localStorage.getItem("lspd_user");
if(user){document.getElementById("auth").style.display="none";document.getElementById("who").innerText=user;}
window.authLogin=async()=>{
let name=document.getElementById("authName").value.trim();
let pass=document.getElementById("authPass").value.trim();
let msg=document.getElementById("authMsg");
if(!name||!pass){msg.innerText="عبي البيانات";return}
msg.innerText="⏳ جاري...";
try{
let ref=doc(db,"soldiers",name.toLowerCase());
let snap=await getDoc(ref);
if(!snap.exists()){
await setDoc(ref,{name:name,password:pass,points:0,rank:"عسكري",status:"نشط",created:Date.now()});
localStorage.setItem("lspd_user",name);
msg.innerText="✅ تم تسجيلك!";
setTimeout(()=>location.reload(),800);
}else{
if(snap.data().password==pass){localStorage.setItem("lspd_user",name);location.reload()}
else{msg.innerText="❌ كلمة السر غلط"}
}
}catch(e){msg.innerText="خطأ: "+e.message}
}
</script>
</body>
</html>
