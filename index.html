<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSPD | Police Department</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#080b10;
color:#fff;
}

button,input,select,textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

.top{
height:70px;
background:#10151d;
border-bottom:1px solid #27303b;
display:flex;
align-items:center;
padding:0 15px;
position:sticky;
top:0;
z-index:20;
}

.menu{
width:44px;
height:44px;
border:0;
border-radius:12px;
background:#202733;
color:#fff;
font-size:23px;
}

.logo{
font-size:22px;
font-weight:bold;
margin-right:12px;
}

.logo span{
color:#4d8dff;
}

.notify{
margin-right:auto;
width:44px;
height:44px;
border:0;
border-radius:12px;
background:#202733;
color:white;
font-size:19px;
position:relative;
}

.badge{
position:absolute;
top:-4px;
left:-4px;
background:#ef4444;
width:19px;
height:19px;
border-radius:50%;
font-size:11px;
display:flex;
align-items:center;
justify-content:center;
}

.sidebar{
position:fixed;
top:0;
right:-300px;
height:100vh;
width:285px;
background:#10141b;
border-left:1px solid #29313c;
z-index:50;
padding:20px;
transition:.25s;
}

.sidebar.open{
right:0;
}

.side-title{
font-size:22px;
font-weight:bold;
margin-bottom:25px;
}

.nav{
display:block;
width:100%;
border:0;
background:transparent;
color:#cbd5e1;
padding:14px;
border-radius:11px;
text-align:right;
margin-bottom:7px;
font-size:14px;
}

.nav:hover,
.nav.active{
background:#1c2a3e;
color:white;
}

.overlay{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:40;
}

.overlay.show{
display:block;
}

.container{
max-width:1150px;
margin:auto;
padding:22px 15px;
}

.page{
display:none;
}

.page.active{
display:block;
}

.hero{
background:linear-gradient(135deg,#121d2c,#10151d);
border:1px solid #293441;
border-radius:18px;
padding:25px;
margin-bottom:17px;
}

.hero h1{
margin:0 0 8px;
}

.muted{
color:#8d98a8;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin-bottom:17px;
}

.card{
background:#11161e;
border:1px solid #29313c;
border-radius:15px;
padding:17px;
}

.card small{
color:#8d98a8;
}

.big{
font-size:27px;
font-weight:bold;
margin-top:8px;
}

.panel{
background:#11161e;
border:1px solid #29313c;
border-radius:16px;
margin-bottom:17px;
overflow:hidden;
}

.panel-title{
padding:16px;
border-bottom:1px solid #29313c;
font-weight:bold;
}

.panel-body{
padding:17px;
}

table{
width:100%;
border-collapse:collapse;
}

.table-wrap{
overflow-x:auto;
}

th,td{
padding:13px;
border-bottom:1px solid #252d37;
text-align:right;
white-space:nowrap;
}

th{
font-size:12px;
color:#8d98a8;
}

input,select,textarea{
width:100%;
background:#0b0f15;
border:1px solid #303a47;
border-radius:10px;
padding:12px;
color:#fff;
outline:none;
}

textarea{
min-height:120px;
resize:vertical;
}

.form{
display:grid;
gap:11px;
}
