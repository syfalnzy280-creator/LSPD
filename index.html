<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSPD</title>
<style>
body{margin:0;background:#0a0e14;color:#fff;font-family:Arial}
.box{max-width:380px;margin:80px auto;background:#151a23;border:1px solid #2a3441;border-radius:18px;padding:28px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;margin:10px 0;box-sizing:border-box}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:#2a7fff;color:#fff;font-weight:bold;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #222;text-align:right}
.top{background:#11161e;padding:12px;display:flex;gap:10px;align-items:center}
#err{color:#ff6666;background:#2a1515;padding:10px;border-radius:8px;margin-top:10px;display:none;direction:ltr;font-size:12px;white-space:pre-wrap;text-align:left}
</style>
</head>
<body>
<div id="loginDiv" class="box">
<div style="font-size:48px">🚔</div>
<h2>LSPD</h2>
<input id="nameI" placeholder="اكتب اسمك">
<button class="btn" id="goBtn">🚪 دخول</button>
<div id="err"></div>
<div id="stat" style="color:#f0c040;margin-top:10px;font-size:13px"></div>
</div>

<div id="mainDiv" style="display:none">
<div class="top"><span id="who"></span><button onclick="localStorage.clear();location.reload()" style="margin-right:auto;background:#40191d;border:0;color:#fff;padding:8px 12px;border-radius:8px">خروج</button></div>
<div style="padding:18px">
<h3>👮 العساكر - <span id="cnt">0</span></h3>
<table><thead><tr><th>#</th><th>الاسم</th><th>الرتبة</th></tr></thead><tbody id="tb"></tbody></table>
<p style="color:#888;font-size:12px;margin-top:20px">انسخ رابط موقعك وارسله لاخوياك - بيدخلون معك مباشر</p>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDPW113hl8oe6RfF6rpq_-vUQ_0AK34sSs",authDomain:"lspd-2026-1.firebaseapp.com",projectId:"lspd-2026-1"};
let db, soldiers=[];
const errBox=document.getElementById("err");
const stat=document.getElementById("stat");

function showE(m){errBox.style.display="block";errBox.textContent=m; stat.textContent="❌ فيه خطأ - شوف المربع الأحمر";}

try{
let app=initializeApp(firebaseConfig);
db=getFirestore(app);
stat.textContent="✅ متصل...";
}catch(e){showE(e.message);}

let me=localStorage.getItem("ME")||"";

function render(){
 document.getElementById("tb").innerHTML=soldiers.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.rank}</td></tr>`).join("");
 document.getElementById("cnt").textContent=soldiers.length;
}

function openMain(){
 document.getElementById("loginDiv").style.display="none";
 document.getElementById("mainDiv").style.display="block";
 document.getElementById("who").textContent="👋 "+me;
 render();
}

document.getElementById("goBtn").addEventListener("click",async()=>{
 let n=document.getElementById("nameI").value.trim();
 if(!n){alert("اكتب اسمك");return;}
 stat.textContent="⏳ جاري الدخول...";
 try{
  let ex=soldiers.find(s=>s.name.toLowerCase()===n.toLowerCase());
  if(!ex){
   let id=Date.now().toString();
   let rank=soldiers.length===0?"لواء":"عسكري";
   await setDoc(doc(db,"soldiers",id),{id:id,name:n,rank:rank});
   stat.textContent="✅ تم إنشائك";
  }
  me=n; localStorage.setItem("ME",me);
  openMain();
 }catch(e){showE(e.code+" : "+e.message);}
});

if(db){
 onSnapshot(collection(db,"soldiers"),(snap)=>{
  soldiers=snap.docs.map(d=>d.data());
  stat.textContent="✅ متصل - العدد: "+soldiers.length;
  render();
  if(me && soldiers.find(s=>s.name.toLowerCase()===me.toLowerCase())) openMain();
 },(e)=>{showE(e.code+" : "+e.message);});
}

if(me) document.getElementById("nameI").value=me;
</script>
</body>
</html>
